# Apex sales page — static files from /var/www/terasetia.com
# www redirects to https://terasetia.com (after TLS) / http during bootstrap

server {
    listen 80;
    listen [::]:80;
    server_name www.terasetia.com;
    return 301 http://terasetia.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name terasetia.com;

    root /var/www/terasetia.com;
    index index.html;

    # ACME / Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/terasetia.com;
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
